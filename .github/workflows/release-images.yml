name: Build and publish release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/squadtimer:${{ inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: watcher/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/squadtimer-watcher:${{ inputs.version }}
      - name: Assemble Windows package
        run: pwsh -NoLogo -NoProfile -File scripts/package-windows.ps1 -Version "${{ inputs.version }}" -OutputDirectory dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SquadTimer v${{ inputs.version }}
          files: dist/SquadTimer-${{ inputs.version }}-windows.zip
